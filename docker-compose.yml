
services:
  postgres:
    image: postgres:17
    container_name: spring-ecommerce_best_place
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce_best_place
      POSTGRES_USER: root
      POSTGRES_PASSWORD:

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spring_user -d spring_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
