
spring:
  application:
    name: "Best Place"

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_best_place
    username: root
    password: ecommercebestplace
    driver-class-name: org.postgresql.Driver

  jpa:

    hibernate:

      ddl-auto: update

    show-sql: true

    properties:

      hibernate:

        format_sql: true

    open-in-view: false

  jackson:

    serialization:

      indent-output: true

server:

  port: 8080
