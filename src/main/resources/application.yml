
spring:
  application:
    name: "Best Place"

  datasource:
    url: jdbc:mysql://localhost:54321/ecommerce_best_place
    user: root
    password:

    driver-class-name: com.postgresql.Driver

    jpa:

      hibernate:

        ddl-auto: update

      show-sql: true

      properties:

        hibernate:

          format_sql: true

      open-in-view: false

    jackson:

      serialization:

        indent-output: true

  server:

    port: 8080
